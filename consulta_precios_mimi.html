<title>Consulta de Precios Mimi</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra sticky de búsqueda + filtros arriba, rejilla de fichas de producto con precios por unidad/media docena/docena */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#15222d; --muted:#5d6b78; --line:#dde3e8;
  --accent:#0d6b5e; --accent-ink:#ffffff; --accent-soft:#dff0ec;
  --offer:#b4540a; --offer-soft:#fbe9d7; --ok:#1d7a3e; --ok-soft:#dff2e5; --out:#8a96a2; --out-soft:#e9edf0;
  --f-display:'Archivo Narrow','Arial Narrow',sans-serif; --f-body:'Figtree',system-ui,sans-serif; --f-mono:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171e; --surface:#172430; --ink:#e8eef3; --muted:#93a3b1; --line:#263643;
  --accent:#3fc2ac; --accent-ink:#06211c; --accent-soft:#143a34;
  --offer:#f0a35e; --offer-soft:#3d2a15; --ok:#6fd392; --ok-soft:#173a25; --out:#8696a4; --out-soft:#202f3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171e; --surface:#172430; --ink:#e8eef3; --muted:#93a3b1; --line:#263643;
  --accent:#3fc2ac; --accent-ink:#06211c; --accent-soft:#143a34;
  --offer:#f0a35e; --offer-soft:#3d2a15; --ok:#6fd392; --ok-soft:#173a25; --out:#8696a4; --out-soft:#202f3b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px)) 12px;border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;display:grid;gap:10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-transform:uppercase}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.search input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:100%;min-width:0}
.chip{font:inherit;font-size:14px;font-weight:500;padding:8px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.clear{margin-left:auto;background:none;border:0;color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:8px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0;align-content:start}
.row1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.code{font-family:var(--f-mono);font-weight:500;font-size:16px;overflow-wrap:anywhere}
.brand{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-align:right;overflow-wrap:anywhere}
.desc{font-size:14px;color:var(--muted)}
.talla{font-family:var(--f-mono);font-size:12px;background:var(--out-soft);color:var(--ink);padding:2px 7px;border-radius:4px;white-space:nowrap}
.desc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prices{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pr{padding:8px 10px;min-width:0}
.pr+.pr{border-left:1px solid var(--line)}
.pr small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pr b{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.pr.main{background:var(--accent-soft)}
.foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.stock-in{background:var(--ok-soft);color:var(--ok)}
.stock-out{background:var(--out-soft);color:var(--out)}
.offer{background:var(--offer-soft);color:var(--offer)}
.copy{margin-left:auto;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.empty{margin:48px 0;text-align:center;color:var(--muted)}
.more{display:block;margin:20px auto 0;font:inherit;font-weight:600;padding:12px 24px;border-radius:6px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.note{font-size:12px;color:var(--muted);margin-top:24px}
@media (max-width:420px){.pr b{font-size:21px}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

let list=[];
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function apply(){
  const terms=norm(S.q).split(/\s+/).filter(Boolean);
  const qf=norm(S.q).replace(/[^a-z0-9]/g,'');
  list=rows.filter(r=>(!S.marca||r.marca===S.marca)&&(!S.tipo||r.tipo===S.tipo)&&(!S.stock||r.st>0)&&(!S.oferta||r.of!=null)&&(terms.every(t=>r.hay.includes(t)||r.flat.includes(t.replace(/[^a-z0-9]/g,'')))||(qf.length>2&&r.flat.includes(qf))));
  if(S.sort==='pa')list.sort((a,b)=>(a.p??1e9)-(b.p??1e9));
  else if(S.sort==='pd')list.sort((a,b)=>(b.p??-1)-(a.p??-1));

}
function card(r){
  return `<article class="card"><div class="row1"><span class="code">${esc(r.cod)}</span><span class="brand">${esc(r.marca)}</span></div>

}

  const part=list.slice(0,S.shown);

  $('empty').hidden=list.length>0;
  $('more').hidden=list.length<=S.shown;
