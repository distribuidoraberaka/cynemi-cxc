var IDX={};
for(var i=0;i<RAW.length;i++){IDX[i]=RAW[i];}

function fmt(n){return"$"+parseFloat(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function pctStr(n){return(n*100).toFixed(1)+"%";}
function margenClass(m){
  if(m>=0.25)return"g";
  if(m>=0.20)return"a";
  return"r";
}
function precioConMargen(costo,pct){return costo/(1-pct/100);}

function render(p){
  var lab=p[0],nom=p[1],cod=p[2],costo=p[3],pu=p[4],p7=p[5],pub=p[6],mu=p[7],m7=p[8];
  var mcU=margenClass(mu), mc7=margenClass(m7);
  var html='<div class="card">'
    +'<div class="ch"><h2>'+nom+'</h2><div class="meta">'+lab+(cod?' &middot; Cód. '+cod:'')+'</div></div>'
    +'<div class="kpis">'
    +'<div class="kp"><div class="kl">Costo c/IVA</div><div class="kv">'+fmt(costo)+'</div></div>'
    +'<div class="kp"><div class="kl">Precio p&#250;blico</div><div class="kv">'+fmt(pub)+'</div></div>'
    +'<div class="kp"><div class="kl">Precio unitario</div><div class="kv">'+fmt(pu)+'</div>'
    +'<div class="ks '+mcU+'">'+pctStr(mu)+' margen</div></div>'
    +'<div class="kp"><div class="kl">Precio 7 unidades</div><div class="kv">'+fmt(p7)+'</div>'
    +'<div class="ks '+mc7+'">'+pctStr(m7)+' margen</div></div>'
    +'</div>'
    +'<div class="sec"><div class="sl">&#127919; Simular precio por margen</div>'
    +'<div class="sim-row"><span>Margen deseado</span>'
    +'<input type="range" id="sl" min="10" max="40" value="25" step="1" oninput="simular('+costo+')">'
    +'<span class="pct-out" id="spct">25%</span></div>'
    +'<div class="res-box"><span class="rl">Precio m&#237;nimo con ese margen</span>'
    +'<span class="rv" id="sres">'+fmt(precioConMargen(costo,25))+'</span></div>'
    +'<div class="warn-min" id="swarn"></div></div>'
    +'<div class="formula">Precio = Costo c/IVA &divide; (1 &minus; margen%) &nbsp;|&nbsp; Tope m&#237;nimo recomendado: 20% &middot; Excepcional: 15%</div>'
    +'</div>';
  document.getElementById("fc").innerHTML=html;
  document.getElementById("ev").style.display="none";
  simular(costo);
  window._costo=costo;
}

function simular(costo){
  var c=costo||window._costo;if(!c)return;
  var sl=document.getElementById("sl");if(!sl)return;
  var pct=parseInt(sl.value);
  document.getElementById("spct").textContent=pct+"%";
  var precio=precioConMargen(c,pct);
  var resEl=document.getElementById("sres");
  resEl.textContent=fmt(precio);
  var warn=document.getElementById("swarn");
  if(pct<15){resEl.style.color="#B91C1C";warn.textContent="&#9888;&#65039; Por debajo del m&#237;nimo absoluto (15%)";}
  else if(pct<20){resEl.style.color="#D97706";warn.textContent="&#9888;&#65039; Excepcional — solo clientes estrat&#233;gicos";}
  else if(pct<25){resEl.style.color="#92400E";warn.textContent="Zona de precauci&#243;n — margen ajustado";}
  else{resEl.style.color="#15803D";warn.textContent="";}
}

var inp=document.getElementById("inp");
var sug=document.getElementById("sug");

function doSearch(){
  var q=inp.value.trim().toLowerCase();
  if(q.length<2){sug.style.display="none";return;}
  var m=[];
  for(var i=0;i<RAW.length&&m.length<8;i++){
    var r=RAW[i];
    if(r[1].toLowerCase().indexOf(q)>=0||r[0].toLowerCase().indexOf(q)>=0)m.push({i:i,r:r});
  }
  if(!m.length){sug.style.display="none";return;}
  var h="";
  for(var j=0;j<m.length;j++){
    h+='<div class="si" data-i="'+m[j].i+'">'+m[j].r[1]+'<div class="ss">'+m[j].r[0]+'</div></div>';
  }
  sug.innerHTML=h;
  sug.style.display="block";
  var divs=sug.querySelectorAll(".si");
  for(var j=0;j<divs.length;j++){
    (function(idx){divs[idx].addEventListener("click",function(){
      inp.value=RAW[parseInt(this.getAttribute("data-i"))][1];
      sug.style.display="none";
      render(RAW[parseInt(this.getAttribute("data-i"))]);
    });})(j);
  }
}

inp.addEventListener("input",doSearch);
inp.addEventListener("keyup",doSearch);
inp.addEventListener("keydown",function(e){if(e.key==="Enter"){sug.style.display="none";buscar();}});
document.addEventListener("click",function(e){if(!e.target.closest("#sw"))sug.style.display="none";});

function buscar(){
  sug.style.display="none";
  var q=inp.value.trim().toLowerCase();
  if(!q)return;
  for(var i=0;i<RAW.length;i++){
    if(RAW[i][1].toLowerCase().indexOf(q)>=0||RAW[i][0].toLowerCase().indexOf(q)>=0){
      render(RAW[i]);return;
    }
  }
  document.getElementById("fc").innerHTML='<div class="empty"><span class="ic">&#128531;</span>No se encontr&#243; "'+inp.value+'".<br>Intent&#225; con otra parte del nombre.</div>';
  document.getElementById("ev").style.display="none";
}

function cargar(input){
  var file=input.files[0];if(!file)return;
  var st=document.getElementById("us");st.textContent="Leyendo archivo...";
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:"array"});
      var wsName=wb.SheetNames[1]||wb.SheetNames[0];
      var ws=wb.Sheets[wsName];
      var rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      if(rows.length>0&&rows[0]){
        var keys=Object.keys(rows[0]);
        if(keys.length>4&&rows[0][keys[0]]==="LAB."||rows[0][keys[0]]==="ARSAL"){
          // already has real headers
        } else {
          // first row might be the real header
          var hdrs=rows[0];
          rows=rows.slice(1);
          for(var i=0;i<rows.length;i++){
            var nr={};var kk=Object.keys(hdrs);
            for(var j=0;j<kk.length;j++)nr[hdrs[kk[j]]]=rows[i][kk[j]];
            rows[i]=nr;
          }
        }
      }
      var newRaw=[];
      for(var i=0;i<rows.length;i++){
        var r=rows[i];
        var c=parseFloat(r["COSTO/ C IVA"]||r["COSTO/C IVA"]||0);
        if(!c||c<=0)continue;
        newRaw.push([
          String(r["LAB."]||""),String(r["PRODUCTO"]||""),String(r["CODIGO BASE"]||r["CODIGO"]||""),
          Math.round(c*10000)/10000,
          Math.round((parseFloat(r["U"]||0))*10000)/10000,
          Math.round((parseFloat(r["7 U"]||0))*10000)/10000,
          Math.round((parseFloat(r["PUBLICO"]||0))*100)/100,
          Math.round((parseFloat(r["MARGEN UNIDAD"]||0))*10000)/10000,
          Math.round((parseFloat(r["MARGEN 7 U."]||0))*10000)/10000
        ]);
      }
      RAW.length=0;for(var i=0;i<newRaw.length;i++)RAW.push(newRaw[i]);
      document.getElementById("tot").textContent=RAW.length+" productos";
      document.getElementById("fc").innerHTML="";
      document.getElementById("ev").style.display="block";
      document.getElementById("inp").value="";
      st.textContent="Base actualizada con "+RAW.length+" productos.";
    }catch(err){st.textContent="Error: "+err.message;}
  };
  reader.readAsArrayBuffer(file);
}
