let IDX={};
RAW.forEach(r=>{ IDX[r[0]]=r; });

function $f(n){return '$'+parseFloat(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function pill(d){if(!d||d<=0)return'';if(d<=40)return'<span class="pill pv">'+d+' d</span>';if(d<=60)return'<span class="pill pa">'+d+' d</span>';if(d<=90)return'<span class="pill pn">'+d+' d</span>';return'<span class="pill pr">'+d+' d</span>';}
function dec(r){
  if(!r[12].length)return'<span class="dec dv">&#9989; Al día</span>';
  const d=r[6],m=r[5];
  if(m>0&&d>60)return'<span class="dec dr">&#128308; Retener — mora + vencido</span>';
  if(m>0)return'<span class="dec dn">&#128992; Revisar — mora activa</span>';
  if(d>90)return'<span class="dec dr">&#128308; Retener — +90 días</span>';
  if(d>60)return'<span class="dec dn">&#128992; Revisar — 61-90 días</span>';
  if(d>40)return'<span class="dec da">&#128993; Condicional</span>';
  return'<span class="dec dv">&#128994; Despachar</span>';
}

function render(r){
  const tieneP=r[12].length>0;
  const sC=r[5]>0?'r':r[4]>0?'w':'';
  let alr='';
  if(r[5]>0){const fm=r[12].filter(p=>p[3]>0).map(p=>'#'+p[0]+' ('+$f(p[3])+')').join(', ');alr='<div class="alr mora">&#9888;&#65039; Mora en '+fm+'</div>';}
  let pHtml='';
  if(tieneP){
    pHtml='<div class="sec"><div class="sl">Facturas pendientes</div>';
    r[12].forEach(p=>{pHtml+='<div class="fr"><div><div class="fn">Fact. #'+p[0]+'</div><div class="ff">'+p[5]+'</div>'+(p[3]>0?'<div class="fmo">EN MORA</div>':'')+'</div><div class="fm">'+$f(p[2])+'</div>'+pill(p[4])+'</div>';});
    pHtml+='</div>';
  }
  let uHtml='';
  if(r[13].length){
    uHtml='<div class="sec"><div class="sl">Últimas 3 pagadas</div>';
    r[13].forEach(u=>{uHtml+='<div class="fr"><div><div class="fn">Fact. #'+u[0]+'</div><div class="ff">'+u[3]+'</div></div><div class="fm">'+$f(u[1])+'</div>'+pill(u[2])+'</div>';});
    uHtml+='</div>';
  }
  const mS=r[11]?'~'+r[11].toFixed(1)+' meses':'—';
  const html='<div class="card">'
    +'<div class="ch"><h2>'+(r[1]||r[0])+'</h2><div class="meta">'+r[0]+' &middot; '+r[2]+' &middot; '+r[3]+'</div>'+dec(r)+'</div>'
    +'<div class="kpis">'
    +'<div class="kp"><div class="kl">Fact. pendientes</div><div class="kv'+(tieneP?' r':'')+'">'+r[12].length+'</div><div class="ks">'+(tieneP?'más antigua: '+r[6]+' días':'Pagó todo')+'</div></div>'
    +'<div class="kp"><div class="kl">Saldo pendiente</div><div class="kv '+sC+'">'+$f(r[4])+'</div><div class="ks">'+(r[5]>0?'mora: '+$f(r[5]):r[4]>0?'sin mora':'Saldo cero')+'</div></div>'
    +'<div class="kp"><div class="kl">Abono mes hist.</div><div class="kv">'+(r[7]>0?$f(r[7]):'—')+'</div><div class="ks">'+(tieneP&&r[11]?'sale en '+mS:r[7]>0?'prom. histórico':'Sin historial')+'</div></div>'
    +'<div class="kp"><div class="kl">Máx. fact. pagada</div><div class="kv">'+(r[8]>0?$f(r[8]):'—')+'</div><div class="ks">'+(r[9]>0?'paga ~'+r[9]+' días prom.':'Sin historial')+'</div></div>'
    +'</div>'
    +alr+pHtml+uHtml
    +'<div class="sec"><div class="sl">Historial</div>'
    +'<div class="hr"><span class="hl">Días prom. pago</span><span class="hv'+(r[9]>60?' w':'')+'">'+( r[9]>0?r[9]+' días':'—')+'</span></div>'
    +'<div class="hr"><span class="hl">Facturas en historial</span><span class="hv">'+r[10]+'</span></div>'
    +'<div class="hr"><span class="hl">Máxima fact. pagada</span><span class="hv">'+(r[8]>0?$f(r[8]):'—')+'</span></div>'
    +'</div>'
    +'<div class="ps">'
    +'<div class="pl">&#128181; Pago informado por el vendedor</div>'
    +'<div class="pd">El vendedor dice que el cliente pagó. Registralo aquí — queda como <strong>no confirmado</strong> hasta que aparezca en el CXC actualizado.</div>'
    +'<div class="pr2"><input type="number" id="pi" placeholder="Ej: 179.00" step="0.01" min="0"><button onclick="simular()">Simular</button></div>'
    +'<div class="pres" id="pr"></div>'
    +'</div>'
    +'</div>';
  document.getElementById('fc').innerHTML=html;
  document.getElementById('ev').style.display='none';
  window._cr=r;
}

function simular(){
  const r=window._cr; if(!r)return;
  const m=parseFloat(document.getElementById('pi').value);
  const pr=document.getElementById('pr');
  if(!m||m<=0){pr.className='pres on';pr.style.background='#FEF2F2';pr.style.color='#991B1B';pr.innerHTML='Ingresá un monto válido.';return;}
  const sT=Math.max(r[4]-m,0);
  const mT=Math.max(r[5]-m,0);
  let msg='&#9888;&#65039; <strong>No confirmado</strong> — no está en el CXC aún.<br><br>';
  msg+='Si el pago de <strong>'+$f(m)+'</strong> es real:<br>';
  msg+='&bull; Saldo quedaría: <strong>'+$f(sT)+'</strong><br>';
  if(r[5]>0) msg+='&bull; Mora quedaría: <strong>'+$f(mT)+'</strong>'+(mT<=0?' &#10003;':'')+'<br>';
  if(r[8]>0&&r[12].length>0){const ult=r[12][r[12].length-1][1];if(ult>r[8])msg+='&bull; &#9888;&#65039; El pedido ('+$f(ult)+') supera el máximo histórico ('+$f(r[8])+')';}
  pr.className='pres on';
  pr.style.background=mT>0?'#FFFBEB':'#F0FDF4';
  pr.style.color=mT>0?'#92400E':'#15803D';
  pr.innerHTML=msg;
}

const inp=document.getElementById('inp');
const sug=document.getElementById('sug');

inp.addEventListener('input',doSearch);
inp.addEventListener('keyup',doSearch);
inp.addEventListener('keydown',function(e){if(e.key==='Enter'){sug.style.display='none';buscar();}});
document.addEventListener('click',function(e){if(!e.target.closest('#sw'))sug.style.display='none';});

function sel(n){inp.value=n;sug.style.display='none';if(IDX[n])render(IDX[n]);}

function buscar(){
  sug.style.display='none';
  const q=inp.value.trim().toLowerCase();
  if(!q)return;
  if(!RAW.length){alert('Los datos aún se están cargando. Esperá un segundo e intentá de nuevo.');return;}
  const r=RAW.find(c=>c[0].toLowerCase().includes(q)||(c[1]&&c[1].toLowerCase().includes(q))||(c[2]&&c[2].toLowerCase().includes(q)));
  if(r)render(r);
  else{document.getElementById('fc').innerHTML='<div class="empty"><span class="ic">&#128531;</span>No se encontró "<strong>'+inp.value+'</strong>".<br>Intentá con el nombre completo o el negocio.</div>';document.getElementById('ev').style.display='none';}
}

function cargar(input){
  const file=input.files[0];if(!file)return;
  const st=document.getElementById('us');
  st.textContent='Leyendo archivo...';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const ws=wb.Sheets['CXC'];
      if(!ws){st.textContent='Error: no hay hoja "CXC".';return;}
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      procesarCXC(rows);
      st.textContent='Base actualizada con '+RAW.length+' clientes.';
    }catch(err){st.textContent='Error: '+err.message;}
  };
  reader.readAsArrayBuffer(file);
}

function procesarCXC(rows){
  const pend=rows.filter(r=>r.ESTADO==='PENDIENTE');
  const canc=rows.filter(r=>r.ESTADO==='CANCELADO');
  const map={};
  pend.forEach(row=>{
    const n=row.CLIENTE;if(!n)return;
    if(!map[n])map[n]=[n,row.ESTABLEC||'',row.CIUDAD||'',row.VEND||'',0,0,0,0,0,0,0,null,[],[]];
    const c=map[n];
    const s=parseFloat(row.SALDO)||0,m=parseFloat(row.MORA)||0,d=parseFloat(row['DIAS CREDITO'])||0,mt=parseFloat(row['MONTO TOTAL'])||0;
    c[4]=Math.round((c[4]+s)*100)/100;c[5]=Math.round((c[5]+m)*100)/100;
    if(d>c[6])c[6]=Math.round(d);
    c[12].push([String(row['#']||''),Math.round(mt*100)/100,Math.round(s*100)/100,Math.round(m*100)/100,Math.round(d),row.DESPACHO?new Date(row.DESPACHO).toLocaleDateString('es-SV'):'']);
  });
  Object.values(map).forEach(c=>c[12].sort((a,b)=>b[4]-a[4]));
  const hmap={};
  canc.forEach(row=>{
    const n=row.CLIENTE;if(!n)return;
    if(!hmap[n])hmap[n]=[];
    hmap[n].push({mt:parseFloat(row['MONTO TOTAL'])||0,dur:parseFloat(row.DURACION)||0,fp:row['FECHA DE CANCEL.']?new Date(row['FECHA DE CANCEL.']):null,fd:row.DESPACHO?new Date(row.DESPACHO):null,num:String(row['#']||'')});
  });
  Object.entries(hmap).forEach(([n,facts])=>{
    const dv=facts.filter(f=>f.dur>0).map(f=>f.dur);
    const dp=dv.length?Math.round(dv.reduce((a,b)=>a+b)/dv.length):0;
    const mx=Math.max(...facts.map(f=>f.mt));
    const fps=facts.map(f=>f.fp).filter(Boolean);const fds=facts.map(f=>f.fd).filter(Boolean);
    let ab=0;if(fps.length&&fds.length){const pr=new Date(Math.min(...fds));const ul=new Date(Math.max(...fps));const ms=Math.max((ul-pr)/(86400000*30),1);ab=Math.round(facts.reduce((a,f)=>a+f.mt,0)/ms*100)/100;}
    const ul=[...facts].sort((a,b)=>(b.fp||0)-(a.fp||0)).slice(0,3).map(f=>([f.num,Math.round(f.mt*100)/100,Math.round(f.dur),f.fp?f.fp.toLocaleDateString('es-SV',{month:'short',year:'numeric'}):'']));
    if(map[n]){const c=map[n];c[7]=ab;c[8]=Math.round(mx*100)/100;c[9]=dp;c[10]=facts.length;c[11]=ab>0&&c[4]>0?Math.round(c[4]/ab*10)/10:null;c[13]=ul;}
    else{map[n]=[n,'','','',0,0,0,ab,Math.round(mx*100)/100,dp,facts.length,null,[],ul];}
  });
  RAW.length=0;Object.values(map).forEach(c=>RAW.push(c));
  IDX={};RAW.forEach(r=>{IDX[r[0]]=r;});
  document.getElementById('fb').textContent=RAW.length+' clientes actualizados';
  document.getElementById('fc').innerHTML='';document.getElementById('ev').style.display='block';
  document.getElementById('inp').value='';
}
</script>
