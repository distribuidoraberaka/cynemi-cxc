<style>
:root{--bg:#1a1a18;--surface:#242420;--border:#38382f;--accent:#d4622a;--text:#e8e4d8;--muted:#8a8474;--chip:#2e2e28;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px;position:sticky;top:0;z-index:100;}
.hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
h1{font-size:17px;font-weight:700;color:var(--accent);}
.sub{color:var(--muted);font-size:11px;}
.ctr{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;}
.filters{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filters label{color:var(--muted);font-size:11px;}
select{background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:12px;cursor:pointer;}
.bcl{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:4px 10px;cursor:pointer;font-size:11px;}
.bcl:hover{color:var(--text);border-color:var(--accent);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;padding:14px 18px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:12px;display:flex;flex-direction:column;gap:7px;transition:border-color .15s;}
.card:hover{border-color:var(--accent);}
.card.urgente{background:#3a1010;border-color:#7a2020;}
.card.recurrente{background:#0e2a40;border-color:#1a5070;}
.card.nota{background:#2a200a;border-color:#5a3a10;}
.ct{display:flex;align-items:flex-start;gap:7px;}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:2px;}
.ti{font-size:13px;font-weight:600;line-height:1.4;flex:1;}
.chips{display:flex;flex-wrap:wrap;gap:4px;}
.chip{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--chip);color:var(--muted);border:1px solid var(--border);}
.rd{border-color:#3a5580;color:#7aaad0;}.rc{border-color:#3a6a3a;color:#7ac07a;}.ri{border-color:#6a3a7a;color:#b07ac0;}.rp{border-color:#7a5a2a;color:#c09060;}.rs{border-color:#505050;color:#909090;}
.eu{background:#4a1010;color:#d07070;border-color:#7a1818;}.er{background:#0a2a4a;color:#70a0d0;border-color:#185a80;}.en{background:#3a2808;color:#b08030;border-color:#604010;}
.nt{font-size:11px;color:var(--muted);font-style:italic;line-height:1.3;}
.cl{font-size:10px;color:var(--muted);}
.ds{background:var(--chip);color:var(--text);border:1px solid var(--accent);border-radius:5px;padding:4px 8px;font-size:11px;width:100%;cursor:pointer;margin-top:2px;}
.footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px;}
.sc{color:var(--muted);font-size:12px;}
.bcp{background:var(--accent);color:#fff;border:none;border-radius:5px;padding:7px 18px;font-size:13px;font-weight:600;cursor:pointer;}
.bcp:hover{background:#bf5520;}
.bcp:disabled{background:var(--chip);color:var(--muted);cursor:default;}
.toast{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:7px 18px;border-radius:20px;font-size:12px;font-weight:600;display:none;z-index:999;}
.empty{text-align:center;color:var(--muted);padding:50px 20px;grid-column:1/-1;}
</style>
</head>

"item": "Activar promociones con Bernal", "estado": "Pendiente", "prioridad": "", "naturaleza": "Tarea Puntual", "notas": "", "cortes": ["Guatemala — Maipa"], "roles": ["Internacional"]}, {"id": "item074", "item": "Enviar a Karla pedidos cotización ISSS", "estado": "Pendiente", "prioridad": "", "naturaleza": "Tarea Puntual", "notas": "", "cortes": ["Comercial"], "roles": ["Droguería"]}, {"id": "item075", "item": "Análisis post-compra y meses de inventario", "estado": "Pendiente", "prioridad": "", "naturaleza": "Proyecto acotado", "notas": "", "cortes": ["Compra"], "roles": ["Droguería"]}]};
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const RC={Droguería:'rd',Calzado:'rc',Internacional:'ri',Personal:'rp',Sistema:'rs'};
const sel={};
function render(){
const fr=document.getElementById('fr').value;
const fe=document.getElementById('fe').value;
const fn=document.getElementById('fn').value;
const items=DATA.items.filter(it=>{
if(fr&&!it.roles.includes(fr))return false;
if(fe&&it.estado!==fe)return false;
if(fn&&it.naturaleza!==fn)return false;
return true;
});
document.getElementById('ctr').textContent=items.length+' ítems';
const g=document.getElementById('grid');
if(!items.length){g.innerHTML='<div class="empty">Sin resultados con estos filtros</div>';return;}
g.innerHTML=items.map(it=>{
const cls=it.estado==='Urgente'?'urgente':it.estado==='Recurrente'?'recurrente':it.estado==='Nota estratégica'?'nota':'';
const chk=sel[it.id]!==undefined;
const dia=sel[it.id]||'';
const ec=it.estado==='Urgente'?'eu':it.estado==='Recurrente'?'er':it.estado==='Nota estratégica'?'en':'';
const estC=it.estado?`<span class="chip ${ec}">${it.estado}</span>`:'';
const natC=it.naturaleza?`<span class="chip">${it.naturaleza}</span>`:'';
const rolC=it.roles.map(r=>`<span class="chip ${RC[r]||''}">${r}</span>`).join('');
const crtT=it.cortes.length?`<div class="cl">↳ ${it.cortes.join(' · ')}</div>`:'';
const ntT=it.notas?`<div class="nt">${it.notas}</div>`:'';
const dSel=chk?`<select class="ds" onchange="setDia('${it.id}',this.value)"><option value="">— día —</option>${DIAS.map(d=>`<option ${dia===d?'selected':''}>${d}</option>`).join('')}</select>`:'';
return `<div class="card ${cls}">
<div class="ct"><input type="checkbox" id="c${it.id}" ${chk?'checked':''} onchange="tog('${it.id}')"><label class="ti" for="c${it.id}">${it.item}</label></div>
<div class="chips">${estC}${natC}${rolC}</div>
${crtT}${ntT}${dSel}
</div>`;
}).join('');
updSel();
}
function tog(id){
const c=document.getElementById('c'+id);
if(c.checked)sel[id]='';else delete sel[id];
render();
}
function setDia(id,d){sel[id]=d;updSel();}
function updSel(){
const n=Object.keys(sel).length;
document.getElementById('sc').textContent=n+' elegido'+(n!==1?'s':'');
document.getElementById('bcp').disabled=n===0;
}
function copiar(){
const lines=[];
for(const[id,dia]of Object.entries(sel)){
const it=DATA.items.find(x=>x.id===id);
if(!it)continue;
lines.push(`${dia||'Sin día'} — ${it.item} [${it.roles.join('/')}]`);
}
navigator.clipboard.writeText(lines.join('\n')).then(()=>{
const t=document.getElementById('toast');
t.style.display='block';
setTimeout(()=>t.style.display='none',2000);
});
}
function clearF(){
['fr','fe','fn'].forEach(id=>document.getElementById(id).value='');
render();
}
render();
</script>
