<title>El Asador — Mapa de Cortes</title>
<style>
:root{
  --bg:#1c1815; --panel:#25201b; --panel2:#2e2620;
  --line:#4a3e33; --text:#f2e9de; --muted:#b3a292;
  --ember:#c65d31; --ember2:#e2793f;
  --green:#5f8a5a; --yellow:#c9a13b; --red:#b8503f; --gray:#6b6259; --purple:#8a6bab;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Georgia',serif;}
header{padding:28px 32px 18px;border-bottom:1px solid var(--line);}
header h1{margin:0;font-size:28px;font-weight:400;letter-spacing:0.3px;}
header p{margin:6px 0 0;color:var(--muted);font-size:14px;font-family:Arial,sans-serif;}
.controls{display:flex;flex-wrap:wrap;gap:10px;padding:18px 32px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
select, input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:Arial,sans-serif;font-size:13px;}
select:focus, input:focus{outline:1px solid var(--ember2);}
.count-bar{padding:10px 32px;font-family:Arial,sans-serif;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
.count-bar b{color:var(--ember2);}
#grid{padding:8px 32px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;transition:border-color .15s;}
.card.picked{border-color:var(--ember2);background:#2e2016;}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.card .item{font-size:15px;line-height:1.35;flex:1;}
.chk{width:20px;height:20px;flex-shrink:0;accent-color:var(--ember2);cursor:pointer;margin-top:2px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-family:Arial,sans-serif;}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);}
.tag.rol{color:var(--text);border-color:var(--ember);background:rgba(198,93,49,0.15);}
.tag.nat{color:var(--text);}
.tag.estado{}
.corte{font-size:12px;color:var(--muted);margin-top:8px;font-family:Arial,sans-serif;font-style:italic;}
.notas{font-size:12px;color:var(--muted);margin-top:8px;font-family:Arial,sans-serif;border-top:1px dashed var(--line);padding-top:8px;}
.empty{padding:60px;text-align:center;color:var(--muted);font-family:Arial,sans-serif;}
footer{padding:20px 32px 40px;color:var(--muted);font-family:Arial,sans-serif;font-size:12px;text-align:center;}
</style>
</head>

<div class="count-bar">

<div id="grid"></div>

const items = DATA.items;

const natColors = {
  "Cita":"var(--purple)","Mandado":"var(--yellow)","Tarea Puntual":"var(--green)",
  "Proyecto acotado":"var(--ember2)","Iniciativa Mutante":"var(--red)","A la espera":"var(--gray)",
  "Sin clasificar":"var(--muted)"
};
const estadoColors = {
  "Urgente":"var(--red)","Pendiente":"var(--muted)","Recurrente":"var(--green)",
  "Nota estratégica":"var(--purple)","Bloqueado":"var(--red)","Hecho":"var(--green)"
};

function uniq(arr){ return [...new Set(arr)].sort(); }

function populateSelect(id, values){
  const sel = document.getElementById(id);
  values.forEach(v=>{
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
}

populateSelect('fRol', uniq(items.flatMap(i=>i.roles)));
populateSelect('fNaturaleza', uniq(items.map(i=>i.naturaleza)));
populateSelect('fEstado', uniq(items.map(i=>i.estado).filter(Boolean)));
populateSelect('fPrioridad', uniq(items.map(i=>i.prioridad).filter(Boolean)));

const picked = new Set();
const pickedDays = {};

function render(){
  const rol = document.getElementById('fRol').value;
  const nat = document.getElementById('fNaturaleza').value;
  const est = document.getElementById('fEstado').value;
  const pri = document.getElementById('fPrioridad').value;
  const q = document.getElementById('fBuscar').value.toLowerCase();
  const soloElegidos = document.getElementById('fSoloElegidos').value;

  let filtered = items.filter(i=>{
    if(rol && !i.roles.includes(rol)) return false;
    if(nat && i.naturaleza !== nat) return false;
    if(est && i.estado !== est) return false;
    if(pri && i.prioridad !== pri) return false;
    if(q && !i.item.toLowerCase().includes(q)) return false;
    if(soloElegidos === '1' && !picked.has(i.id)) return false;
    return true;
  });

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty">Nada calza con este filtro. Probá abrir otro.</div>';
  }
  filtered.forEach(i=>{
    const card = document.createElement('div');
    card.className = 'card' + (picked.has(i.id) ? ' picked' : '');
    const natColor = natColors[i.naturaleza] || 'var(--muted)';
    card.innerHTML = `
      <div class="top">
        <div class="item">${i.item}</div>
        <input type="checkbox" class="chk" ${picked.has(i.id)?'checked':''} data-id="${i.id}">
      </div>
      ${picked.has(i.id) ? `<select class="daySel" data-id="${i.id}" style="margin-top:6px;background:var(--panel2);color:var(--text);border:1px solid var(--ember2);border-radius:6px;padding:5px 8px;font-family:Arial,sans-serif;font-size:12px;width:100%;">
        <option value="">Día...</option>
        ${['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'].map(d=>`<option value="${d}" ${pickedDays[i.id]===d?'selected':''}>${d}</option>`).join('')}
      </select>` : ''}
      <div class="tags">
        ${i.roles.map(r=>`<span class="tag rol">${r}</span>`).join('')}
        <span class="tag nat" style="border-color:${natColor};color:${natColor}">${i.naturaleza}</span>
        ${i.estado ? `<span class="tag estado" style="border-color:${estadoColors[i.estado]||'var(--line)'}">${i.estado}</span>` : ''}
        ${i.prioridad ? `<span class="tag">${i.prioridad}</span>` : ''}
      </div>
      <div class="corte">${i.cortes.join(' · ')}</div>
      ${i.notas ? `<div class="notas">${i.notas}</div>` : ''}
    `;
    grid.appendChild(card);
  });

  document.getElementById('cCount').textContent = filtered.length;
  document.getElementById('cTotal').textContent = items.length;
  document.getElementById('cPicked').textContent = picked.size;

  grid.querySelectorAll('.chk').forEach(chk=>{
    chk.addEventListener('change', e=>{
      const id = e.target.dataset.id;
      if(e.target.checked) picked.add(id); else { picked.delete(id); delete pickedDays[id]; }
      render();
    });
  });
  grid.querySelectorAll('.daySel').forEach(sel=>{
    sel.addEventListener('change', e=>{
      pickedDays[e.target.dataset.id] = e.target.value;
    });
    sel.addEventListener('click', e=>e.stopPropagation());
  });
}

document.getElementById('btnExport').addEventListener('click', ()=>{
  const lines = [...picked].map(id=>{
    const it = items.find(i=>i.id===id);
    const dia = pickedDays[id] || '(sin día)';
    return `${dia} — ${it.item} [${it.roles.join('/')}]`;
  });
  const text = lines.length ? lines.join('\n') : 'No hay ítems elegidos todavía.';
  navigator.clipboard.writeText(text).then(()=>{
    alert('Copiado ' + lines.length + ' ítems al portapapeles. Pegalo en el chat de la Dominical.');
  }).catch(()=>{
    prompt('Copiá manualmente:', text);
  });
});

['fRol','fNaturaleza','fEstado','fPrioridad','fSoloElegidos'].forEach(id=>{
  document.getElementById(id).addEventListener('change', render);
});
document.getElementById('introText').textContent = items.length + ' piezas sobre la mesa. Filtrá, elegí lo que entra esta semana, y avisame cuáles marcaste.';

render();
</script>

</html>
