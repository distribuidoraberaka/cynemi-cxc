  if(r[13].length){
    uHtml='<div class="sec"><div class="sl">&#218;ltimas 3 pagadas</div>';
    for(var i=0;i<r[13].length;i++){var u=r[13][i];uHtml+='<div class="fr"><div><div class="fn">Fact. #'+u[0]+'</div><div class="ff">'+u[3]+"</div></div>"+'<div class="fm">'+fmt(u[1])+"</div>"+pill(u[2])+"</div>";}
    uHtml+="</div>";
  }
  var mS=r[11]?"~"+r[11].toFixed(1)+" meses":"&mdash;";
  var html='<div class="card">'
    +'<div class="ch"><h2>'+(r[1]||r[0])+'</h2><div class="meta">'+r[0]+" &middot; "+r[2]+" &middot; "+r[3]+"</div>"+dec(r)+"</div>"
    +'<div class="kpis">'
    +'<div class="kp"><div class="kl">Fact. pendientes</div><div class="kv'+(tieneP?" r":"")+'">'+r[12].length+"</div>"+'<div class="ks">'+(tieneP?"m&#225;s antigua: "+r[6]+" d&#237;as":"Pag&#243; todo")+"</div></div>"
    +'<div class="kp"><div class="kl">Saldo pendiente</div><div class="kv '+sC+'">'+fmt(r[4])+"</div>"+'<div class="ks">'+(r[5]>0?"mora: "+fmt(r[5]):r[4]>0?"sin mora":"Saldo cero")+"</div></div>"
    +'<div class="kp"><div class="kl">Abono mes hist.</div><div class="kv">'+(r[7]>0?fmt(r[7]):"&mdash;")+"</div>"+'<div class="ks">'+(tieneP&&r[11]?"sale en "+mS:r[7]>0?"prom. hist&#243;rico":"Sin historial")+"</div></div>"
    +'<div class="kp"><div class="kl">M&#225;x. fact. pagada</div><div class="kv">'+(r[8]>0?fmt(r[8]):"&mdash;")+"</div>"+'<div class="ks">'+(r[9]>0?"paga ~"+r[9]+" d&#237;as prom.":"Sin historial")+"</div></div>"
    +"</div>"
    +alr+pHtml+uHtml
    +'<div class="sec"><div class="sl">Historial</div>'
    +'<div class="hr"><span class="hl">D&#237;as prom. pago</span><span class="hv'+(r[9]>60?" w":"")+'">'+( r[9]>0?r[9]+" d&#237;as":"&mdash;")+"</span></div>"
    +'<div class="hr"><span class="hl">Facturas en historial</span><span class="hv">'+r[10]+"</span></div>"
    +'<div class="hr"><span class="hl">M&#225;xima fact. pagada</span><span class="hv">'+(r[8]>0?fmt(r[8]):"&mdash;")+"</span></div>"
    +"</div>"
    +'<div class="ps"><div class="pl">&#128181; Pago informado por el vendedor</div>'
    +'<div class="pd">El vendedor dice que el cliente pag&#243;. Registralo aqu&#237; &mdash; queda como <strong>no confirmado</strong> hasta que aparezca en el CXC actualizado.</div>'
    +'<div class="pr2"><input type="number" id="pi" placeholder="Ej: 179.00" step="0.01" min="0"><button onclick="simular()">Simular</button></div>'
    +'<div class="pres" id="pr"></div></div>'
    +"</div>";
  document.getElementById("fc").innerHTML=html;
  document.getElementById("ev").style.display="none";
  window._cr=r;
}
function simular(){
  var r=window._cr;if(!r)return;
  var m=parseFloat(document.getElementById("pi").value);
  var pr=document.getElementById("pr");
  if(!m||m<=0){pr.className="pres on";pr.style.background="#FEF2F2";pr.style.color="#991B1B";pr.innerHTML="Ingres&#225; un monto v&#225;lido.";return;}
  var sT=Math.max(r[4]-m,0);var mT=Math.max(r[5]-m,0);
  var msg="&#9888;&#65039; <strong>No confirmado</strong> &mdash; no est&#225; en el CXC a&#250;n.<br><br>";
  msg+="Si el pago de <strong>"+fmt(m)+"</strong> es real:<br>";
  msg+="&bull; Saldo quedar&#237;a: <strong>"+fmt(sT)+"</strong><br>";
  if(r[5]>0)msg+="&bull; Mora quedar&#237;a: <strong>"+fmt(mT)+"</strong>"+(mT<=0?" &#10003;":"")+"<br>";
  if(r[8]>0&&r[12].length>0){var ult=r[12][r[12].length-1][1];if(ult>r[8])msg+="&bull; &#9888;&#65039; El pedido ("+fmt(ult)+") supera el m&#225;ximo hist&#243;rico ("+fmt(r[8])+")";}
  pr.className="pres on";pr.style.background=mT>0?"#FFFBEB":"#F0FDF4";pr.style.color=mT>0?"#92400E":"#15803D";pr.innerHTML=msg;
}
var inp=document.getElementById("inp");
var sug=document.getElementById("sug");
function doSearch(){
  var q=inp.value.trim().toLowerCase();
  if(q.length<2){sug.style.display="none";return;}
  var m=[];
  for(var i=0;i<RAW.length&&m.length<7;i++){if(RAW[i][0].toLowerCase().indexOf(q)>=0||(RAW[i][1]&&RAW[i][1].toLowerCase().indexOf(q)>=0)||(RAW[i][2]&&RAW[i][2].toLowerCase().indexOf(q)>=0))m.push(i);}
  if(!m.length){sug.style.display="none";return;}
  var h="";
  for(var j=0;j<m.length;j++){h+='<div class="si" data-i="'+m[j]+'">'+(RAW[m[j]][1]||RAW[m[j]][0])+'<div class="ss">'+RAW[m[j]][0]+" &middot; "+RAW[m[j]][2]+" &middot; "+RAW[m[j]][3]+"</div></div>";}
  sug.innerHTML=h;sug.style.display="block";
  var divs=sug.querySelectorAll(".si");
  for(var j=0;j<divs.length;j++){(function(el){el.addEventListener("click",function(){var idx=parseInt(this.getAttribute("data-i"));inp.value=RAW[idx][0];sug.style.display="none";render(RAW[idx]);});})(divs[j]);}
}
inp.addEventListener("input",doSearch);inp.addEventListener("keyup",doSearch);
inp.addEventListener("keydown",function(e){if(e.key==="Enter"){sug.style.display="none";buscar();}});
document.addEventListener("click",function(e){if(!e.target.closest("#sw"))sug.style.display="none";});
function buscar(){
  sug.style.display="none";var q=inp.value.trim().toLowerCase();if(!q)return;
  for(var i=0;i<RAW.length;i++){if(RAW[i][0].toLowerCase().indexOf(q)>=0||(RAW[i][1]&&RAW[i][1].toLowerCase().indexOf(q)>=0)||(RAW[i][2]&&RAW[i][2].toLowerCase().indexOf(q)>=0)){render(RAW[i]);return;}}
  document.getElementById("fc").innerHTML='<div class="empty"><span class="ic">&#128531;</span>No se encontr&#243; "'+inp.value+'".<br>Intent&#225; con parte del nombre o del negocio.</div>';
  document.getElementById("ev").style.display="none";
}
function cargar(input){
  var file=input.files[0];if(!file)return;
  var st=document.getElementById("us");st.textContent="Leyendo archivo...";
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
      var ws=wb.Sheets["CXC"];if(!ws){st.textContent="Error: no hay hoja CXC.";return;}
      var rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      var pend=[],canc=[];
      for(var i=0;i<rows.length;i++){if(rows[i].ESTADO==="PENDIENTE")pend.push(rows[i]);else if(rows[i].ESTADO==="CANCELADO")canc.push(rows[i]);}
      var map={};
      for(var i=0;i<pend.length;i++){
        var row=pend[i];var n=row.CLIENTE;if(!n)continue;
        if(!map[n])map[n]=[n,row.ESTABLEC||"",row.CIUDAD||"",row.VEND||"",0,0,0,0,0,0,0,null,[],[]];
        var c=map[n];var s=parseFloat(row.SALDO)||0,mo=parseFloat(row.MORA)||0,d=parseFloat(row["DIAS CREDITO"])||0,mt=parseFloat(row["MONTO TOTAL"])||0;
        c[4]=Math.round((c[4]+s)*100)/100;c[5]=Math.round((c[5]+mo)*100)/100;
        if(d>c[6])c[6]=Math.round(d);
        c[12].push([String(row["#"]||""),Math.round(mt*100)/100,Math.round(s*100)/100,Math.round(mo*100)/100,Math.round(d),row.DESPACHO?new Date(row.DESPACHO).toLocaleDateString("es-SV"):""]);
      }
      var keys=Object.keys(map);for(var i=0;i<keys.length;i++)map[keys[i]][12].sort(function(a,b){return b[4]-a[4];});
      var hmap={};
      for(var i=0;i<canc.length;i++){
        var row=canc[i];var n=row.CLIENTE;if(!n)continue;
        if(!hmap[n])hmap[n]=[];
        hmap[n].push({mt:parseFloat(row["MONTO TOTAL"])||0,dur:parseFloat(row.DURACION)||0,fp:row["FECHA DE CANCEL."]?new Date(row["FECHA DE CANCEL."]):null,fd:row.DESPACHO?new Date(row.DESPACHO):null,num:String(row["#"]||"")});
      }
      var hkeys=Object.keys(hmap);
      for(var i=0;i<hkeys.length;i++){
        var n=hkeys[i];var facts=hmap[n];
        var dv=[],sum=0;for(var j=0;j<facts.length;j++){if(facts[j].dur>0)dv.push(facts[j].dur);sum+=facts[j].mt;}
        var dp=dv.length?Math.round(dv.reduce(function(a,b){return a+b;})/dv.length):0;
        var mx=0;for(var j=0;j<facts.length;j++)if(facts[j].mt>mx)mx=facts[j].mt;
        var fps=[],fds=[];for(var j=0;j<facts.length;j++){if(facts[j].fp)fps.push(facts[j].fp);if(facts[j].fd)fds.push(facts[j].fd);}
        var ab=0;if(fps.length&&fds.length){var pr=new Date(Math.min.apply(null,fds)),ul=new Date(Math.max.apply(null,fps)),ms=Math.max((ul-pr)/(86400000*30),1);ab=Math.round(sum/ms*100)/100;}
        facts.sort(function(a,b){return(b.fp||0)-(a.fp||0);});
        var ul=[];for(var j=0;j<Math.min(3,facts.length);j++)ul.push([facts[j].num,Math.round(facts[j].mt*100)/100,Math.round(facts[j].dur),facts[j].fp?facts[j].fp.toLocaleDateString("es-SV",{month:"short",year:"numeric"}):""]);
        if(map[n]){var c=map[n];c[7]=ab;c[8]=Math.round(mx*100)/100;c[9]=dp;c[10]=facts.length;c[11]=ab>0&&c[4]>0?Math.round(c[4]/ab*10)/10:null;c[13]=ul;}
        else{map[n]=[n,"","","",0,0,0,ab,Math.round(mx*100)/100,dp,facts.length,null,[],ul];}
      }
      RAW.length=0;var mkeys=Object.keys(map);for(var i=0;i<mkeys.length;i++)RAW.push(map[mkeys[i]]);
      IDX={};for(var i=0;i<RAW.length;i++)IDX[RAW[i][0]]=RAW[i];
      document.getElementById("fb").textContent=RAW.length+" clientes actualizados";
      document.getElementById("fc").innerHTML="";document.getElementById("ev").style.display="block";document.getElementById("inp").value="";
      st.textContent="Base actualizada con "+RAW.length+" clientes.";
    }catch(err){st.textContent="Error: "+err.message;}
  };
  reader.readAsArrayBuffer(file);
}
</script>
